<style>
:root{
 --bg:#07131d;--bg2:#0c2230;--panel:#0e2533;--panel2:#102c3c;
 --line:#28566b;--cyan:#55d9ff;--ice:#dff7ff;--text:#f5fbff;--muted:#a9c4d1;
 --good:#163f36;--bad:#4a2027;--warn:#3d3518;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;color:var(--text)}
body{background:
 radial-gradient(circle at 85% 8%,#16465b 0,transparent 28%),
 linear-gradient(145deg,var(--bg),var(--bg2) 55%,#08151e);
 font-size:18px;letter-spacing:.2px}
.wrap{width:100%;max-width:none;min-height:100svh;margin:0;padding:0 0 92px}
.hero{min-height:100svh;width:100%;border-radius:0;padding:clamp(24px,5vw,54px) clamp(18px,5vw,64px) 105px;
 display:flex;flex-direction:column;justify-content:center;background:
 linear-gradient(180deg,#07131dbf,#07131df0),
 repeating-linear-gradient(90deg,transparent 0 49px,#55d9ff0b 50px),
 repeating-linear-gradient(0deg,transparent 0 49px,#55d9ff0b 50px)}
.hero:before{content:"◉  DRONE SOCCER  /  REFEREE TRAINING";display:block;color:var(--cyan);font-weight:900;letter-spacing:2.2px;font-size:13px;margin-bottom:16px}
h1{font-size:clamp(32px,7vw,58px);line-height:1.12;margin:0 0 13px;font-weight:950;letter-spacing:-1px;text-shadow:0 0 24px #55d9ff22}
h2{font-size:clamp(25px,5vw,36px);line-height:1.25;font-weight:900}
.sub{font-size:clamp(17px,3.8vw,22px);color:var(--muted);font-weight:650;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:25px;width:100%}
button,.btn{border:1px solid var(--line);border-radius:16px;padding:20px 16px;font-size:clamp(17px,4vw,21px);line-height:1.35;font-weight:850;cursor:pointer;color:var(--text);
 background:linear-gradient(145deg,#102c3c,#0b202d);box-shadow:0 8px 22px #0005;min-height:76px}
button:active{transform:scale(.985)}
.b1,.b2,.b3,.b4,.b5{background:linear-gradient(145deg,#123447,#0c2432)}
.b1{border-color:#3d8ca7}.b2{border-color:#5aa4b8}.b3{border-color:#356f8b}.b4{border-color:#6c7280}.b5{border-color:#8a793e}
button span.small{color:var(--muted)}
.wide{grid-column:1/-1}
.panel{width:min(980px,100%);min-height:calc(100svh - 70px);margin:0 auto;padding:clamp(22px,5vw,48px) clamp(16px,5vw,50px) 100px;
 background:linear-gradient(180deg,#0d2230,#081721);border-radius:0;box-shadow:none}
.hide{display:none!important}
.progress{height:10px;background:#183343;border-radius:99px;overflow:hidden;margin:14px 0 26px}
.bar{height:100%;background:linear-gradient(90deg,#55d9ff,#b8f1ff);width:0;box-shadow:0 0 14px #55d9ff}
.opt{display:block;width:100%;text-align:left;margin:12px 0;padding:20px 18px;background:#102936;border:1px solid #315669;border-radius:14px;font-size:clamp(18px,4vw,22px);font-weight:760;min-height:68px}
.opt:hover{border-color:var(--cyan);background:#123243}
.ok{background:var(--good)!important;border-color:#52c79e!important}.bad{background:var(--bad)!important;border-color:#e06f7c!important}
.meta{font-size:15px;color:var(--cyan);font-weight:750;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.explain{background:#112d39;border:1px solid #37687b;border-left:5px solid var(--cyan);border-radius:13px;padding:17px;margin-top:16px;font-size:17px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#102936;border:1px solid #274b5c;border-radius:15px;padding:18px;text-align:center;color:var(--muted)}.stat b{display:block;font-size:30px;color:var(--text)}
footer{position:fixed;right:10px;bottom:8px;font-size:11px;color:#c3d6df;background:#07131de8;border:1px solid #294957;padding:7px 10px;border-radius:8px;z-index:20}
.small{font-size:14px;color:var(--muted)} select{width:100%;padding:16px;border-radius:12px;border:1px solid #35586a;background:#0d2633;color:white;font-size:18px}
.tech-ball{width:96px;height:96px;margin:22px auto 0;border:5px solid #6ce2ff;border-radius:50%;position:relative;box-shadow:0 0 28px #55d9ff66,inset 0 0 20px #55d9ff33}
.tech-ball:before,.tech-ball:after{content:"";position:absolute;left:13px;right:13px;top:42px;height:3px;background:#6ce2ff;transform:rotate(45deg);box-shadow:0 0 10px #55d9ff}
.tech-ball:after{transform:rotate(-45deg)}
@media(max-width:620px){

}
@media print{

 .print-sign{position:absolute;right:8mm;bottom:5mm;font-size:9pt}.print-q{margin:0 0 14px;line-height:1.6}
}

}

<body><div class="wrap">
<section id="home" class="hero">

</section>

 mode=m; let pool=custom||Q.map((q,i)=>({...q,id:i}));
 if(!custom){
  if(m==='advanced') pool=pool.filter(q=>q.adv);
  if(m==='wrong'||m==='wrongExam') pool=pool.filter(q=>state.wrongIds.includes(q.id));
  if(m==='sessionWrong') pool=pool.filter(q=>sessionWrong.includes(q.id));
 }
 if(!pool.length){alert('目前沒有這個範圍的錯題，太厲害了！');return}
 let n=m==='mock'?Math.min(30,pool.length):m==='advanced'?Math.min(25,pool.length):Math.min(30,pool.length);
 if(['wrong','wrongExam','sessionWrong','page'].includes(m)) n=pool.length;
 run=shuffle(pool).slice(0,n);idx=0;score=0;sessionWrong=[];hideAll();$('quiz').classList.remove('hide');window.scrollTo(0,0);$('modeName').textContent=modeLabel(m);render()
}
function render(){
 locked=false;$('next').classList.add('hide');$('explain').classList.add('hide');
 let q=run[idx];$('counter').textContent=`${idx+1} / ${run.length}｜教材 P.${q.p}`;$('bar').style.width=`${idx/run.length*100}%`;
 $('question').textContent=q.q;$('options').innerHTML='';
 let order=q.o.map((t,i)=>({t,i})); order=shuffle(order);
 order.forEach(x=>{let b=document.createElement('button');b.className='opt';b.textContent=x.t;b.onclick=()=>answer(x.i,b);$('options').appendChild(b)})
}
function answer(choice,btn){
 if(locked)return;locked=true;let q=run[idx],ok=choice===q.a;state.attempts++; if(ok){score++;state.correct++;btn.classList.add('ok')} else {btn.classList.add('bad');sessionWrong.push(q.id);if(!state.wrongIds.includes(q.id))state.wrongIds.push(q.id)}
 if(ok && state.wrongIds.includes(q.id)){state.wrongIds=state.wrongIds.filter(x=>x!==q.id)}
 if(!state.pages.includes(q.p))state.pages.push(q.p);save();
 [...$('options').children].forEach(b=>{if(b.textContent===q.o[q.a])b.classList.add('ok')});
 $('explain').innerHTML=`<b>${ok?'✅ 答對了':'❌ 這題要再加強'}</b><br>${q.e}<br><span class="small">教材來源：P.${q.p}｜${q.cat}</span>`;
 $('explain').classList.remove('hide');$('next').classList.remove('hide')
}
function nextQ(){idx++;if(idx>=run.length)return finish();render()}
function finish(){hideAll();$('result').classList.remove('hide');window.scrollTo(0,0);let pct=Math.round(score/run.length*100);$('resultStats').innerHTML=`<div class=stat><b>${score}</b>答對</div><div class=stat><b>${run.length-score}</b>答錯</div><div class=stat><b>${pct}%</b>正確率</div>`}
function showPagePractice(){hideAll();$('pagePick').classList.remove('hide');window.scrollTo(0,0);let pages=[...new Set(Q.map(q=>q.p))].sort((a,b)=>a-b);$('pageSel').innerHTML=pages.map(p=>`<option value="${p}">教材第 ${p} 頁（${Q.filter(q=>q.p===p).length}題）</option>`).join('')}
function startPage(){let p=+$('pageSel').value;start('page',Q.map((q,i)=>({...q,id:i})).filter(q=>q.p===p))}
function showDashboard(){hideAll();$('dash').classList.remove('hide');window.scrollTo(0,0);let rate=state.attempts?Math.round(state.correct/state.attempts*100):0;$('dashStats').innerHTML=`<div class=stat><b>${state.attempts}</b>累積作答</div><div class=stat><b>${rate}%</b>累積正確率</div><div class=stat><b>${state.wrongIds.length}</b>目前錯題</div><div class=stat><b>${state.pages.length}/29</b>教材頁面進度</div>`}
function printWrong(withAnswers){
 let ids=state.wrongIds.length?state.wrongIds:sessionWrong;let qs=Q.map((q,i)=>({...q,id:i})).filter(q=>ids.includes(q.id));
 if(!qs.length){alert('目前沒有錯題可輸出。');return}
 let per=8,pages=[];for(let i=0;i<qs.length;i+=per)pages.push(qs.slice(i,i+per));
 $('printSheet').innerHTML=pages.map((pg,pi)=>`<div class="print-page"><h2>FAI 丙級裁判檢定｜${withAnswers?'錯題答案解析':'錯題加強練習卷'}</h2><div>姓名：＿＿＿＿＿＿　日期：＿＿＿＿＿＿　　第 ${pi+1}/${pages.length} 頁</div><hr>${pg.map((q,j)=>`<div class=print-q><b>${pi*per+j+1}. ${q.q}</b><br>${q.o.map((x,k)=>`${String.fromCharCode(65+k)}. ${x}`).join('　')} ${withAnswers?`<br><b>答案：${String.fromCharCode(65+q.a)}｜${q.o[q.a]}</b><br>解析：${q.e}`:'<br>作答：＿＿＿＿'}</div>`).join('')}<div class=print-sign>製作：黎昕 Li Xin 跨科教育規劃師／蜜雪兒 Michelle</div></div>`).join('');
 $('printSheet').classList.remove('hide');window.print();setTimeout(()=>$('printSheet').classList.add('hide'),500)
}
</script></body></html>
